name: Bug report
description: Something in AmbWave does not work as expected (one bug per issue)
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Report AmbWave behavior here. Include whether you used the browser emulator or an FM-1; fork-specific reports should not be sent to Felucca upstream. Do not attach private device backups or credentials.
  - type: input
    id: version
    attributes:
      label: AmbWave build or commit
      description: Include the emulator URL or package version and commit when available.
      placeholder: "commit / firmware package / browser URL"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the editor, installer or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo or short video helps.
    validations:
      required: true
